[project]
name = "halal-supplier-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=3.35.1",
    "pillow>=13,<14",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "python-multipart>=0.0.18,<1",
    "rapidfuzz>=3,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: test needing an external service such as PostgreSQL",
    "live: test calling the RunPod endpoint",
]

[tool.ruff]
line-length = 79

[tool.mypy]
strict = true
mypy_path = "src"
