[project]
name = "halal-supplier-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: test needing an external service such as PostgreSQL",
    "live: test calling the RunPod endpoint",
]

[tool.ruff]
line-length = 79

[tool.mypy]
strict = true
mypy_path = "src"
