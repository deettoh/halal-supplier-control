name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: halal
          POSTGRES_PASSWORD: halal_dev
          POSTGRES_DB: halal_supplier_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U halal -d halal_supplier_control"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://halal:halal_dev@localhost:5432/halal_supplier_control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q --run-db
      - run: uv run ruff check --select E,F,I src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src/backend tests
