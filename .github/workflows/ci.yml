name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check --select E,F,I src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src/backend tests
