# This service is for local development. Replit uses its own DATABASE_URL.
name: halal-supplier-control

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: halal_supplier_control
      POSTGRES_USER: halal
      POSTGRES_PASSWORD: halal_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halal -d halal_supplier_control"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
